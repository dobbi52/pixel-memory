<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>픽셀 기억력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Press+Start+2P&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#0B0F1A; --panel:#141A2E; --cell:#1C2340; --line:#2A3150; --line2:#3A4466;
  --text:#E8ECFF; --muted:#8A93C2;
  --green:#39FF88; --green-d:#1F6B45; --pink:#FF4FA3; --pink-d:#7A1F4F; --yellow:#FFE14D; --yellow-d:#7A6A1A;
  --blue:#4FC3FF; --blue-d:#1E5C7A;
  --pix:'Press Start 2P', monospace; --ko:'Do Hyeon', sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ko);min-height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%}
button,a,input,label{touch-action:manipulation}
body{min-height:100vh;min-height:100dvh}
button{font-family:var(--ko);color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
input,textarea{font-family:var(--ko)}
.pix{font-family:var(--pix)}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* buttons */
.btn{border:none;padding:0 20px;height:52px;font-size:20px;background:var(--green);color:var(--bg);box-shadow:5px 5px 0 var(--green-d)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:2px 2px 0 var(--green-d)}
.btn.pink{background:var(--pink);box-shadow:5px 5px 0 var(--pink-d)}
.btn.pink:active:not(:disabled){box-shadow:2px 2px 0 var(--pink-d)}
.btn.yellow{background:var(--yellow);box-shadow:5px 5px 0 var(--yellow-d)}
.btn.yellow:active:not(:disabled){box-shadow:2px 2px 0 var(--yellow-d)}
.btn.ghost{background:transparent;color:var(--text);border:3px solid var(--line2);box-shadow:none}
.btn.blue{background:var(--blue);box-shadow:5px 5px 0 var(--blue-d)}
.btn.blue:active:not(:disabled){box-shadow:2px 2px 0 var(--blue-d)}
.mcount{font-size:17px;white-space:nowrap}
.mcount b{font-family:var(--pix);font-size:13px;font-weight:normal}
.mp{border:2px solid var(--line2);padding:8px 12px}
.mp summary{cursor:pointer;font-size:18px;color:var(--blue)}
.mp-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.mp-row{display:flex;align-items:center;gap:10px;min-height:36px}
.mp-n{flex:1;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-n small{color:var(--muted);font-size:14px}
.mp-s{font-size:12px;color:var(--green)}
.mp-k{min-width:76px;height:34px;background:transparent;border:2px solid var(--line2);color:var(--muted);font-size:15px}
span.mp-k{border:none}
.mp-k.on{border-color:var(--pink);color:var(--pink)}
.btn.small{height:40px;font-size:17px;padding:0 14px}

/* logo */
.logo{display:flex;align-items:center;gap:14px}
.logo-mark{width:34px;height:34px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;flex:none}
.logo-mark i{display:block}
.logo-title{font-size:36px;line-height:1;color:var(--green)}
.logo-sub{font-family:var(--pix);font-size:9px;color:var(--muted);letter-spacing:2px;margin-top:6px}

/* panels */
.panel{background:var(--panel);border:4px solid var(--line2);padding:16px 18px}
.panel.g{border-color:var(--green)}
.panel.p{border-color:var(--pink)}
.panel.y{border-color:var(--yellow)}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tagpix{font-family:var(--pix);font-size:12px}

/* grid canvas */
.grid-wrap{background:var(--bg);padding:2px;width:100%;aspect-ratio:1/1;position:relative;touch-action:none}
.grid-wrap canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
.grid-frame{border:4px solid var(--green)}

/* center screens */
.center{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:17px;color:var(--green)}
.inp{height:56px;padding:0 14px;border:3px solid var(--green);background:var(--panel);color:var(--text);font-size:22px;outline:none;width:100%;border-radius:0}
.inp:focus{border-color:var(--yellow)}
.inp.code{font-family:var(--pix);font-size:22px;letter-spacing:8px;text-align:center}
.err{color:var(--pink);font-size:17px;min-height:22px}
.home-btns{display:flex;flex-direction:column;gap:16px}
.home-btns .btn{height:72px;font-size:24px;display:flex;align-items:center;justify-content:space-between}
.home-btns .btn span.pix{font-size:11px}
.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.note{font-size:15px;color:var(--muted);line-height:1.5;border:2px dashed var(--line2);padding:10px 12px}

/* ====== BOARD (teacher) ====== */
.board{min-height:100vh;min-height:100dvh;padding:18px 28px;display:flex;flex-direction:column;gap:18px;max-width:1600px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.chips{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chip{padding:10px 14px;border:3px solid var(--line2);font-family:var(--pix);font-size:12px}
.chip.code{border-color:var(--yellow);color:var(--yellow);display:flex;gap:10px;align-items:center}
.chip.code b{font-size:20px;letter-spacing:4px}
.chip.round{background:var(--pink);color:var(--bg);border-color:var(--pink)}
.b-main{display:flex;gap:26px;flex:1;min-height:0;flex-wrap:wrap;align-items:flex-start}
.b-left{flex:0 0 auto;width:min(46vw,560px,calc(100vh - 150px));width:min(46vw,560px,calc(100dvh - 150px));display:flex;flex-direction:column;gap:12px}
.b-right{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:20px}
.hintbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px}
.hint-cat{padding:3px 12px;background:var(--yellow);color:var(--bg);font-size:20px}
.hint-cat.off{background:transparent;color:var(--muted);border:2px dashed var(--line2)}
.letters{display:flex;gap:6px;align-items:flex-end}
.letters i{display:block;width:26px;height:6px;background:var(--green)}

.drawers{display:flex;gap:12px}
.dcard{flex:1;min-width:0;padding:12px;border:3px solid var(--line2);display:flex;flex-direction:column;gap:6px;min-height:150px;justify-content:space-between}
.dcard .nm{font-size:28px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard.done{color:var(--muted)}
.dcard.wait{border-style:dashed}
.dcard.now{background:var(--green);color:var(--bg);border-color:var(--green);flex:1.3}
.dcard .tm{font-family:var(--pix);font-size:24px}
.seg10{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;height:10px}
.seg10 i{display:block;background:rgba(11,15,26,.25)}
.seg10 i.on{background:var(--bg)}
.seg10.y i{background:var(--line)}
.seg10.y i.on{background:var(--yellow)}

.rank-row{display:flex;align-items:center;gap:14px;height:32px}
.rank-row .r{width:56px;font-family:var(--pix);font-size:12px}
.rank-row .n{flex:1;font-size:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-row .s{font-family:var(--pix);font-size:15px;color:var(--green)}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* lobby */
.lobby{display:flex;gap:26px;flex-wrap:wrap}
.lobby-join{flex:0 0 auto;width:min(100%,380px);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.qr{background:#fff;padding:10px;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
.qr img,.qr canvas{width:180px!important;height:180px!important;image-rendering:pixelated}
.bigcode{font-family:var(--pix);font-size:40px;color:var(--yellow);letter-spacing:10px}
.url{font-size:15px;color:var(--muted);word-break:break-all}
.lobby-right{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:20px}
.names{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.name-chip{padding:6px 12px;border:2px solid var(--green);font-size:20px}
.name-chip.off{border-color:var(--line2);color:var(--muted)}
.set-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:5px 0;border-bottom:2px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-row .lb{width:110px;font-size:19px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:36px;min-width:52px;padding:0 12px;background:transparent;border:3px solid var(--line2);font-size:18px}
.seg button.on{background:var(--green);color:var(--bg);border-color:var(--green)}
.ta{width:100%;min-height:96px;padding:10px;background:var(--bg);color:var(--text);border:3px solid var(--line2);font-size:18px;line-height:1.5;resize:vertical;font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}

/* result & end */
.banner{background:var(--yellow);color:var(--bg);padding:20px 22px;box-shadow:6px 6px 0 var(--yellow-d);display:flex;align-items:center;justify-content:space-between;gap:12px}
.banner.miss{background:var(--panel);color:var(--text);border:4px solid var(--line2);box-shadow:none}
.banner .big{font-size:36px;line-height:1.1}
.banner .pts{font-family:var(--pix);font-size:30px}
.bonus-row{display:flex;align-items:center;gap:14px;height:40px;padding:0 14px;border:2px solid var(--line);margin-bottom:8px}
.bonus-row .t{width:70px;font-family:var(--pix);font-size:10px}
.bonus-row .n{flex:1;font-size:23px}
.bonus-row .s{font-family:var(--pix);font-size:13px;color:var(--green)}
.answer{display:flex;align-items:center;gap:14px;justify-content:center}
.answer b{font-size:46px;color:var(--yellow);font-weight:normal}
.podium{display:flex;gap:18px;align-items:flex-end;justify-content:center;margin:4px 0 2px}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;width:170px}
.pod .nm{font-size:28px;text-align:center}
.pod .bar{width:100%;display:flex;align-items:flex-start;justify-content:center;padding-top:12px;font-family:var(--pix);font-size:22px;color:var(--bg)}
.wrong-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.wrong-row{display:flex;align-items:center;gap:10px;padding:6px 10px;border:2px solid var(--line)}
.wrong-row .w{flex:1;font-size:20px}
.wrong-row .who{color:var(--muted);font-size:16px}

/* ====== PLAYER (phone) ====== */
.phone{max-width:460px;margin:0 auto;padding:14px 16px 24px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:12px}
.p-top{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:8px}
.p-time{font-family:var(--pix);font-size:20px;color:var(--yellow)}
.turn-tag{padding:8px 10px;background:var(--green);color:var(--bg);font-family:var(--pix);font-size:11px}
.secret{border:3px solid var(--pink);background:var(--panel);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.secret b{font-size:32px;color:var(--yellow);font-weight:normal;line-height:1}
.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.palette button{height:44px;border:2px solid var(--bg);padding:0}
.palette button.on{border:3px solid #fff;box-shadow:0 0 0 3px var(--pink)}
.tools{display:flex;gap:8px}
.tools .btn.ghost{font-size:17px}
.tools .btn{flex:1;height:48px;font-size:18px;padding:0 8px}
.tools .btn.ghost.on{border-color:var(--yellow);color:var(--yellow)}
.scorebar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border:2px solid var(--line2)}
.lives{display:flex;gap:6px;align-items:center}
.misses{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:28px}
.miss-box{display:flex;flex-direction:column;gap:6px}
.miss-h{display:flex;align-items:baseline;gap:8px}
.misses{max-height:78px;overflow-y:auto}
.misses span.w{padding:2px 8px;border:2px solid var(--line2);color:var(--text);font-size:17px;display:inline-flex;align-items:baseline;gap:5px}
.misses span.w small{font-size:13px;color:var(--muted)}
.misses span.w.mine{border-color:var(--pink)}
.misses span.w.mine small{color:var(--pink)}
.guess-row{display:flex;gap:8px;align-items:flex-end}
.guess-row .field{flex:1}
.msg{font-size:20px;text-align:center;padding:12px;border:3px dashed var(--line2)}
.msg.ok{border-color:var(--green);color:var(--green)}
.msg.bad{border-color:var(--pink);color:var(--pink)}
.wait-big{font-size:28px;text-align:center;line-height:1.4}

/* 그림판 + 옆 칸 (폰: 위아래, 넓은 화면: 좌우) */
.play .p-side{display:contents}
.play .p-canvas{order:2}
.play .p-side > *{order:1}
.play .p-side > .after{order:3}
.play .spacer{display:none}
.p-title{font-size:20px}
.p-score{font-size:14px}
.p-note{text-align:center;font-size:16px}
.done-btn{height:52px;font-size:20px}
.hint-row{display:flex;align-items:center;justify-content:space-between;min-height:36px;gap:8px}
.p-letters{font-size:17px}
.miss-t{font-size:18px;color:var(--pink)}
.secret b.hid{color:var(--muted);letter-spacing:6px}
.peek{height:40px;padding:0 12px;background:transparent;border:3px solid var(--yellow);color:var(--yellow);font-size:17px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;white-space:nowrap}
.peek.on{background:var(--yellow);color:var(--bg)}
.peek.need{animation:needPulse .7s steps(2,start) infinite}
@keyframes needPulse{to{background:var(--yellow);color:var(--bg)}}
@media (min-width: 900px) and (min-aspect-ratio: 5/4){
  .phone.play{--cv:min(calc(100vh - 48px), 58vw);max-width:none;display:grid;grid-template-columns:var(--cv) minmax(340px,560px);justify-content:center;align-items:start;column-gap:32px;padding:24px 32px;min-height:100vh}
  .play .p-canvas{width:var(--cv);order:0;grid-column:1;grid-row:1}
  .play .p-side{order:0;grid-column:2;grid-row:1}
  .play .p-side{display:flex;flex-direction:column;gap:16px;min-height:calc(100vh - 48px)}
  .play .spacer{display:block;flex:1}
  .play .p-title{font-size:28px}
  .play .p-time{font-size:28px}
  .play .p-score{font-size:18px}
  .play .scorebar{padding:12px 16px;border-width:3px}
  .play .secret{padding:14px 18px;border-width:4px}
  .play .secret b{font-size:44px}
  .play .palette{grid-template-columns:repeat(4,1fr);gap:10px}
  .play .palette button{height:56px}
  .play .tools .btn{height:52px;font-size:20px}
  .play .done-btn{height:64px;font-size:26px}
  .play .p-note{font-size:18px}
  .play .hint-row{padding:14px 16px;background:var(--panel);border:4px solid var(--yellow)}
  .play .hint-cat{font-size:24px}
  .play .p-letters{font-size:22px}
  .play .lives svg{width:28px;height:25px}
  .play .miss-box{flex:1;min-height:120px;padding:14px 16px;background:var(--panel);border:4px solid var(--pink)}
  .play .miss-t{font-size:24px}
  .play .misses{max-height:none;overflow:auto;flex:1;align-content:flex-start;align-items:flex-start}
  .play .misses span.w{font-size:21px}
  .play .inp{height:60px;font-size:24px}
}
@supports (height: 100dvh){
  @media (min-width: 900px) and (min-aspect-ratio: 5/4){
    .phone.play{--cv:min(calc(100dvh - 48px), 58vw);min-height:100dvh}
    .play .p-side{min-height:calc(100dvh - 48px)}
  }
}
.live{font-size:18px;text-align:center;padding:8px 12px;border:2px solid var(--line2);color:var(--muted);line-height:1.5}
.live b{font-family:var(--pix);font-size:15px;color:var(--green);font-weight:normal}
.live.warn{border-color:var(--yellow);color:var(--yellow)}
.live.warn b{color:var(--yellow)}
.live.full{border-color:var(--pink);color:var(--pink)}
.live.full b{color:var(--pink)}
.rm-dim{position:fixed;inset:0;background:rgba(11,15,26,.85);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.rm-dim[hidden]{display:none}
.rm-box{width:min(100%,460px);display:flex;flex-direction:column;gap:16px}
.rm-mini{width:min(100%,260px);align-self:center}
.board-word{font-size:30px;color:var(--yellow);font-weight:normal;letter-spacing:1px}
.board-word.hid{color:var(--muted);letter-spacing:6px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--yellow);color:var(--bg);padding:10px 16px;font-size:20px;z-index:50;box-shadow:4px 4px 0 var(--yellow-d)}
/* animations */
@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.enter{animation:enter .36s steps(6) both}
@keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.pop{animation:pop .42s steps(6) both}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .36s steps(6)}
.urgent{color:var(--pink)!important;animation:blink .5s steps(2,start) infinite}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.pod .bar{transform-origin:bottom;animation:grow .9s steps(9) both}
.pod:nth-child(1) .bar{animation-delay:.5s}.pod:nth-child(2) .bar{animation-delay:1s}.pod:nth-child(3) .bar{animation-delay:.1s}
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(11,15,26,.9);z-index:40;pointer-events:none;animation:splash 1.7s steps(10) forwards;text-align:center;padding:16px}
@keyframes splash{0%{opacity:0}8%{opacity:1}82%{opacity:1}100%{opacity:0;visibility:hidden}}
.splash .t1{font-family:var(--pix);font-size:clamp(20px,5vw,40px);animation:pop .5s steps(6) both}
.splash .t2{font-size:clamp(30px,7vw,64px);animation:pop .5s .15s steps(6) both}
.splash .bars{display:flex;gap:6px}
.splash .bars i{display:block;width:14px;height:14px;animation:blink .4s steps(2,start) infinite}
.splash .bars i:nth-child(2){animation-delay:.1s}.splash .bars i:nth-child(3){animation-delay:.2s}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.confetti i{position:absolute;top:-20px;display:block;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.armed{background:var(--pink)!important;color:var(--bg)!important;border-color:var(--pink)!important}
.chip.bgm{background:transparent;color:var(--muted);cursor:pointer;font-family:var(--pix)}
.chip.bgm.on{border-color:var(--green);color:var(--green)}
@media (prefers-reduced-motion: reduce){
  .enter,.pop,.shake,.pod .bar,.splash .t1,.splash .t2{animation:none}
  .splash{animation:splash 1.7s steps(1) forwards}
  .confetti{display:none}
}
.modeflag{pointer-events:none;position:fixed;left:10px;bottom:6px;font-family:var(--pix);font-size:8px;color:var(--muted);opacity:.7}

@media (max-width: 900px){
  .board{padding:16px}
  .b-left{width:100%}
  .lobby-join{width:100%}
  .drawers{flex-wrap:wrap}
  .dcard{min-height:110px}
}
/* ====== 픽셀 기억력 ====== */
.home-btns .btn{height:76px}
.big-num{font-family:var(--pix);font-size:clamp(70px,18vw,200px);color:var(--yellow);text-align:center;line-height:1}
.mv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:0}
.mv-grid{width:min(68vh,60vw);width:min(68dvh,60vw);aspect-ratio:1/1;border:6px solid var(--yellow);background:var(--bg)}
.mv-grid canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.mv-t{font-size:clamp(26px,3.4vw,44px);text-align:center}
.mv-time{font-family:var(--pix);font-size:clamp(28px,4vw,56px);color:var(--pink)}
.mv-bar{width:min(68vh,60vw);width:min(68dvh,60vw)}
.ctr3{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.ctr3 .panel{min-width:210px;text-align:center}
.ctr3 b{display:block;font-family:var(--pix);font-weight:normal;font-size:clamp(30px,4vw,52px);color:var(--green);margin-bottom:10px}
.ctr3 .panel.p b{color:var(--pink)}
.ctr3 span{font-size:22px}
.rv{flex:1;display:flex;gap:20px;min-height:0;align-items:stretch}
.rv-gal{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:10px;min-height:calc(100vh - 110px);min-height:calc(100dvh - 110px)}
.rv-side{flex:0 0 clamp(300px,28vw,430px);display:flex;flex-direction:column;gap:12px}
.th{position:relative;padding:0;background:var(--panel);border:3px solid var(--line2);display:block;width:var(--th);height:var(--th)}
.th canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.th .sc{position:absolute;right:0;bottom:0;background:var(--bg);color:var(--green);font-family:var(--pix);font-size:clamp(9px,calc(var(--th) * .13),16px);padding:3px 4px}
.th .nm{position:absolute;left:-3px;right:-3px;top:-3px;background:var(--yellow);color:var(--bg);font-size:clamp(14px,calc(var(--th) * .17),24px);padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th.top{border-color:var(--yellow);box-shadow:0 0 0 3px var(--yellow)}
.th.dim{opacity:.45}
.th.hid{border-style:dashed}
.th.hid span.h{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:clamp(13px,calc(var(--th) * .2),22px)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two canvas{width:100%;aspect-ratio:1/1;display:block;image-rendering:pixelated;background:var(--bg)}
.two .cap{font-size:17px;color:var(--muted);text-align:center;margin-top:4px}
.q-box{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-family:var(--pix);font-size:34px;color:var(--muted);border:3px dashed var(--line2)}
.pic-name{font-size:30px;color:var(--yellow);text-align:center;line-height:1.1}
.stat{font-size:19px;line-height:1.35}
.stat b{color:var(--green);font-weight:normal}
.top3 .rank-row .n{font-size:24px}
.tip{font-size:18px;line-height:1.35;border:2px dashed var(--line2);padding:8px 10px;color:var(--muted)}
.tip b{color:var(--blue);font-weight:normal}
.rv-side .btn{height:60px;font-size:24px;flex:none}
.sp{flex:1}
.lb-note{font-size:16px;color:var(--muted);text-align:center}
.name-chip{background:transparent;color:inherit;font-family:var(--ko);cursor:pointer}
.lobby .set-row .lb{width:130px}
.lobby .panel{padding:12px 16px}
.lobby-right{gap:12px}
.look{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.look .eye{display:grid;grid-template-columns:repeat(11,1fr);gap:2px;width:min(60vw,220px)}
.look .eye i{aspect-ratio:1/1;display:block}
.score-big{font-family:var(--pix);font-size:64px;color:var(--green);text-align:center;line-height:1.1}
.p-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p-two canvas{width:100%;aspect-ratio:1/1;display:block;image-rendering:pixelated}
.p-two .cap{font-size:17px;color:var(--muted);text-align:center;margin-top:4px}
.private{font-size:15px;color:var(--muted);text-align:center}
.hist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hist div{border:2px solid var(--line2);padding:6px;text-align:center}
.hist canvas{width:100%;aspect-ratio:1/1;display:block;image-rendering:pixelated}
.hist b{font-family:var(--pix);font-weight:normal;font-size:12px;color:var(--green);display:block;margin-top:6px}
.award{display:flex;align-items:center;gap:12px;font-size:24px;padding:10px 14px;border:3px solid var(--blue)}
.award b{font-weight:normal;color:var(--blue);flex:none}
.awards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.end-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.pr-grid{width:min(100%,62vh,560px);width:min(100%,62dvh,560px);aspect-ratio:1/1;border:5px solid var(--yellow);background:var(--bg)}
.pr-grid canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.pr-bar{width:min(100%,62vh,560px);width:min(100%,62dvh,560px)}
.tools .btn{min-width:0;white-space:nowrap}
@media (max-width:480px){.tools{gap:6px}.tools .btn,.tools .btn.ghost{font-size:14px;padding:0 1px}}
@media (max-width:900px){
  .rv{flex-direction:column}
  .rv-gal{min-height:0}
  .rv-side{flex:none}
}

const SIMILAR = { 2:[3,7], 3:[2,4,8], 4:[3], 5:[6], 6:[5,7], 7:[2,6], 8:[3], 1:[] };
function colorCredit(a, b){ return a === b ? 1 : ((SIMILAR[a] || []).includes(b) ? 0.65 : 0.45); }
function bestNear(grid, n, r, c, v){
  let best = 0;
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (!dr && !dc) continue;
    const y = r + dr, x = c + dc;
    if (y < 0 || x < 0 || y >= n || x >= n) continue;
    const u = grid[y * n + x]; if (!u) continue;
    const w = u === v ? 0.25 : 0.05;
    if (w > best) best = w;
  }

}
function oneWay(from, to, n, wt){
  let sum = 0, cnt = 0;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {

    const w = wt ? (wt[v] || 0) : 1;
    cnt += w;
    const u = to[r * n + c];
    sum += w * (u ? colorCredit(v, u) : bestNear(to, n, r, c, v));

function colorWeights(t){
  const c = {}; t.forEach(v => { if (v) c[v] = (c[v] || 0) + 1; });
  const w = {}; Object.keys(c).forEach(k => { w[k] = Math.pow(c[k], -0.75); });
  return w;
}
function scoreDrawing(target, drawn, n){
  const t = [...target].map(Number), raw = [...(drawn || '')].map(Number);
  if (raw.length !== n * n || !raw.some(Boolean)) return 0;
  const wt = colorWeights(t);
  let best = 0;
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
    const d = new Array(n * n).fill(0);
    let lost = false;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      const v = raw[r * n + c]; if (!v) continue;
      const y = r + dy, x = c + dx;
      if (y < 0 || x < 0 || y >= n || x >= n) { lost = true; continue; }
      d[y * n + x] = v;
    }
    if (lost) continue;
    const rec = oneWay(t, d, n, wt), pre = oneWay(d, t, n);
    if (rec + pre === 0) continue;
    const f = 2 * rec * pre / (rec + pre);

function makeLocalBackend(memoryOnly){
  const KEY = 'pm-local-db';
  let db = {};

    let o = db;
    for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null || typeof o[ks[i]] !== 'object') o[ks[i]] = {}; o = o[ks[i]]; }

    if (broadcast) { persist(); if (ch) ch.postMessage(writes); }
    notify(writes.map(w => w[0]));
  }

    mode: memoryOnly ? 'practice' : 'local',
    waitConnected: () => Promise.resolve(true),
    now: () => Date.now(),
    on(path, cb){ const s = { path, cb }; subs.add(s); setTimeout(() => { if (subs.has(s)) cb(clone(getAt(path))); }, 0); return () => subs.delete(s); },
    async get(path){ return clone(getAt(path)); },
    async set(path, v){ apply([[path, v]], true); },
    async transaction(path, fn){ const r = fn(clone(getAt(path))); if (r === undefined) return { committed: false }; apply([[path, r]], true); return { committed: true, value: clone(r) }; },
    async update(path, obj){ apply(Object.keys(obj).map(k => [path + '/' + k, obj[k]]), true); },
    push(path, v){ const id = genId(); apply([[path + '/' + id, v]], true); return id; },
    async remove(path){ apply([[path, null]], true); },
    presence(path){ apply([[path, true]], true); this._pres = path; if (!memoryOnly) window.addEventListener('pagehide', () => { if (this._pres === path) apply([[path, false]], true); }); },

    if (i % 2 === 1) this.hat(t);
  }
};

   그림 도우미
   ========================================================= */
const LETTER = { '.':'0', W:'1', R:'2', O:'3', Y:'4', G:'5', B:'6', P:'7', N:'8' };
function picRows(n, i){ return PICS[n][i][1]; }
function picName(n, i){ return PICS[n][i][0]; }
function picPx(n, i){ return picRows(n, i).join('').replace(/./g, c => LETTER[c]); }
function picColors(px){ return [...new Set(px.replace(/0/g, ''))].sort().join(''); }

const ROUNDS = {
  3: [8, 10, 12],
  5: [8, 8, 10, 10, 12],
  7: [8, 8, 10, 10, 10, 12, 12],
  10: [8, 8, 8, 10, 10, 10, 10, 12, 12, 12]
};
const DEFAULT_SETTINGS = { rounds: 5, level: 'mix', viewSec: 10, drawSec: 40 };
const READY_MS = 3000, DRAW_SEC = 40, GRACE_MS = 1200, STAGE0_MS = 6000, STAGE1_MS = 5000;
const TIPS = [
  ['전체 모양부터', '칸을 세기 전에 무슨 그림인지 먼저 잡아요.'],
  ['칸 수 세기', '그림의 가로 폭이 몇 칸인지 세어 두면 크기가 맞아요.'],
  ['가운데 기준', '판의 가운데를 기준으로 어디에 놓였는지 봐요.'],
  ['색 나누기', '색별로 어떤 자리에 있는지 나누어 기억해요.'],
  ['말로 외우기', '"빨간 지붕, 파란 창문"처럼 말로 바꾸면 오래가요.'],
  ['대칭 찾기', '왼쪽과 오른쪽이 같으면 절반만 외워도 돼요.'],
  ['틀린 곳 살피기', '많은 친구가 놓친 칸은 눈에 잘 안 띄는 자리예요.']
];
function tipFor(r){ return TIPS[(r - 1) % TIPS.length]; }

function makePlan(st){
  let used = {}; try { used = JSON.parse(lsGet('pm-used') || '{}') || {}; } catch (e) {}
  const sizes = st.level === 'mix' ? (ROUNDS[st.rounds] || ROUNDS[5]) : new Array(st.rounds).fill(st.level);
  const thisGame = {};
  const plan = sizes.map(n => {
    const mine = thisGame[n] = thisGame[n] || [];
    const all = PICS[n].map((_, i) => i).filter(i => !mine.includes(i));
    let pool = all.filter(i => !(used[n] || []).includes(i));
    if (!pool.length) { used[n] = []; pool = all; }
    const i = pool[Math.floor(Math.random() * pool.length)];
    mine.push(i);
    (used[n] = used[n] || []).push(i);
    return { n, i, view: st.viewSec, draw: st.drawSec };
  });
  lsSet('pm-used', JSON.stringify(used));
  return plan;
}

/* 작은 효과음 */
function sfx(notes, gap = 0.09, vol = 1.6){
  try {
    Music.init(); if (!Music.ctx) return; Music.ctx.resume();
    const t = Music.ctx.currentTime + 0.02;
    notes.forEach((m, i) => Music.tone('square', m, t + i * gap, gap * 1.4, vol));
  } catch (e) {}
}

  myResult: null, myTotal: null, resUnsub: null, totUnsub: null, seenSelf: false, history: null

function players(){ return Object.entries(S.players || {}).filter(([, p]) => p && p.name).map(([id, p]) => ({ id, ...p })); }
function onlinePlayers(){ return players().filter(p => p.online !== false); }
function settings(){ return { ...DEFAULT_SETTINGS, ...((S.meta && S.meta.settings) || {}) }; }

async function createRoom(){
  let code = '';
  for (let i = 0; i < 20; i++) {
    code = String(Math.floor(1000 + Math.random() * 9000));
    const ex = await B.get('rooms/' + code + '/meta');
    if (!ex) break;
  }
  const hostKey = genId();
  S.code = code; S.role = 'host'; S.hostKey = hostKey;
  lsSet('pm-host', JSON.stringify({ code, hostKey, at: Date.now() }));
  await B.set('rooms/' + code, { meta: { created: B.now(), hostKey, settings: { ...DEFAULT_SETTINGS } }, state: { phase: 'lobby', round: 0 } });
  history.replaceState(null, '', location.pathname + '?host=' + code);
  subscribeRoom();
}
async function resumeHost(code){
  const meta = await B.get('rooms/' + code + '/meta');
  let saved = null; try { saved = JSON.parse(lsGet('pm-host') || 'null'); } catch (e) {}
  if (!meta || !saved || saved.code !== code || saved.hostKey !== meta.hostKey) return false;
  S.code = code; S.role = 'host'; S.hostKey = saved.hostKey;
  try { S.plan = JSON.parse(lsGet('pm-plan-' + code) || 'null'); } catch (e) { S.plan = null; }
  subscribeRoom();
  return true;
}
function hostOnState(){
  const s = S.state;
  if (s.phase === 'draw' && S.drawsRound !== s.round) {
    if (S.drawsUnsub) S.drawsUnsub();
    S.drawsRound = s.round; S.liveDraws = {};
    S.drawsUnsub = B.on(roomPath('draws/' + s.round), v => { S.liveDraws = v || {}; updateDynamic(); });
  }
  if (s.phase !== 'draw' && S.drawsUnsub) { S.drawsUnsub(); S.drawsUnsub = null; S.drawsRound = null; }
  if (s.phase === 'reveal' && (!S.rv || S.rv.round !== s.round)) loadReveal();
}
async function startGame(){
  S.plan = makePlan(settings());
  lsSet('pm-plan-' + S.code, JSON.stringify(S.plan));
  const ups = { draws: null, results: null, totals: null };
  await B.update(roomPath(), ups);
  sfx([72, 76, 79, 84]);
  startRound(1);
}
function startRound(r){
  const p = S.plan[r - 1]; const now = B.now();
  S.rv = null; S.advancing = '';
  B.set(roomPath('state'), {
    phase: 'view', round: r, total: S.plan.length, n: p.n,
    colors: picColors(picPx(p.n, p.i)), viewSec: p.view,
    viewAt: now + READY_MS, viewEndsAt: now + READY_MS + p.view * 1000
  });
}
function onceFor(tag){ if (S.advancing === tag) return false; S.advancing = tag; return true; }
function hostTick(){
  const s = S.state; if (!s) return;
  const now = B.now();
  if (s.phase === 'view' && now >= s.viewEndsAt && onceFor('draw:' + s.round)) {
    const p = S.plan && S.plan[s.round - 1];
    B.set(roomPath('state'), { phase: 'draw', round: s.round, total: s.total, n: s.n, colors: s.colors, drawSec: p ? p.draw : DRAW_SEC, drawEndsAt: now + (p ? p.draw : DRAW_SEC) * 1000 });
    sfx([79, 74]);
  }
  if (s.phase === 'draw') {
    const on = onlinePlayers();
    const allDone = on.length > 0 && on.every(p => S.liveDraws[p.id] && S.liveDraws[p.id].done);
    if ((now >= s.drawEndsAt + GRACE_MS || allDone) && onceFor('finish:' + s.round)) finishRound(s.round);
  }
  if (s.phase === 'reveal' && s.stage < 2) {
    const wait = s.stage === 0 ? STAGE0_MS : STAGE1_MS;
    if (now >= s.stageAt + wait && onceFor('stage:' + s.round + ':' + (s.stage + 1))) setStage(s.stage + 1);
  }
}
function setStage(st){ return B.update(roomPath('state'), { stage: st, stageAt: B.now() }); }
function rankList(map){
  const arr = Object.entries(map).map(([id, v]) => ({ id, v })).sort((a, b) => b.v - a.v);
  let last = null, rank = 0;
  arr.forEach((x, i) => { if (x.v !== last) { rank = i + 1; last = x.v; } x.rank = rank; });
  return arr;
}
async function finishRound(r){
  const s = S.state; const p = S.plan[r - 1];
  const target = picPx(p.n, p.i);
  const draws = (await B.get(roomPath('draws/' + r))) || {};
  const prev = (await B.get(roomPath('totals'))) || {};
  const scores = {}, totals = {};
  players().forEach(pl => { const d = draws[pl.id]; scores[pl.id] = scoreDrawing(target, d && d.px, p.n); totals[pl.id] = (prev[pl.id] || 0) + scores[pl.id]; });
  const rr = rankList(scores), tr = rankList(totals);
  const tRank = {}; tr.forEach(x => { tRank[x.id] = x.rank; });
  const results = {};
  rr.forEach(x => { results[x.id] = { s: x.v, r: x.rank, t: totals[x.id], tr: tRank[x.id], np: rr.length }; });
  await B.update(roomPath(), { ['results/' + r]: results, totals });
  buildReveal(r, p, draws, results);
  await B.set(roomPath('state'), { phase: 'reveal', round: r, total: s.total, n: p.n, pic: { n: p.n, i: p.i }, stage: 0, stageAt: B.now() });
  sfx([67, 71, 74]);
}
function buildReveal(r, p, draws, results){
  const ids = Object.keys(draws).filter(id => draws[id] && /[1-9]/.test(draws[id].px || '') && S.players[id]);
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  S.rv = { round: r, n: p.n, i: p.i, target: picPx(p.n, p.i), draws, results, order: ids, hidden: {} };
}
async function loadReveal(){
  const s = S.state; const r = s.round;
  const draws = (await B.get(roomPath('draws/' + r))) || {};
  const results = (await B.get(roomPath('results/' + r))) || {};
  const pl = await B.get(roomPath('players'));
  if (!S.state || S.state.round !== r) return;
  if (pl) S.players = pl;
  buildReveal(r, s.pic, draws, results);
  render(true);
}
function hostNext(){
  const s = S.state; if (!s) return;
  if (s.phase === 'reveal') {
    if (s.stage < 2) { S.advancing = 'stage:' + s.round + ':' + (s.stage + 1); setStage(s.stage + 1); return; }
    if (s.round < s.total) startRound(s.round + 1); else finishGame();
  }
}
async function finishGame(){
  const s = S.state;
  const totals = (await B.get(roomPath('totals'))) || {};
  const all = (await B.get(roomPath('results'))) || {};
  const rounds = []; for (let r = 1; r <= s.total; r++) rounds.push(all[r] || {});
  const ranked = rankList(totals).filter(x => S.players[x.id]);
  const top = ranked.slice(0, 3).map(x => ({ id: x.id, name: S.players[x.id].name, t: x.v, rank: x.rank }));
  const topIds = top.map(x => x.id);
  /* 칭찬하는 상만: 꼴찌를 드러내는 상은 만들지 않음 */
  const stats = ranked.map(x => {
    const sc = rounds.map(rr => rr[x.id] ? rr[x.id].s : 0);
    const avg = sc.reduce((a, b) => a + b, 0) / sc.length;
    return { id: x.id, sc, sd: Math.sqrt(sc.reduce((a, b) => a + (b - avg) * (b - avg), 0) / sc.length), avg, up: sc[sc.length - 1] - sc[0] };
  });
  const others = stats.filter(x => !topIds.includes(x.id));
  const pool = others.length ? others : stats;
  const awards = [];
  const riser = [...pool].sort((a, b) => b.up - a.up)[0];
  if (riser && riser.up > 0) awards.push({ title: '쑥쑥 성장상', name: S.players[riser.id].name });
  const steady = [...pool].filter(x => !riser || x.id !== riser.id || pool.length === 1).filter(x => x.avg >= 30).sort((a, b) => a.sd - b.sd)[0];
  if (steady && (!riser || steady.id !== riser.id)) awards.push({ title: '한결같은 기억상', name: S.players[steady.id].name });
  const avgAll = stats.length ? Math.round(stats.reduce((a, b) => a + b.avg, 0) / stats.length) : 0;
  const pics = (S.plan || []).map(p => ({ n: p.n, i: p.i }));
  await B.set(roomPath('state'), { phase: 'end', round: s.total, total: s.total, top, awards, avgAll, pics });
  sfx([72, 76, 79, 84, 88], 0.12);
  setTimeout(confetti, 300);
}

async function joinRoom(code, name){
  const meta = await B.get('rooms/' + code + '/meta');
  if (!meta) return '방 코드를 찾을 수 없어요';
  const pl = (await B.get('rooms/' + code + '/players')) || {};
  let pid = pidGet(code);
  if (pid && pl[pid] && pl[pid].name) {
    if (name && pl[pid].name !== name) {
      if (Object.entries(pl).some(([id, p]) => id !== pid && p.name === name)) return '이미 같은 이름의 친구가 있어요';
      await B.update('rooms/' + code + '/players/' + pid, { name });
    }
  } else {
    if (Object.values(pl).some(p => p.name === name)) return '이미 같은 이름의 친구가 있어요';
    pid = genId();
    await B.set('rooms/' + code + '/players/' + pid, { name, joined: B.now(), online: true });
    pidSet(code, pid);
  }
  lsSet('pm-name', name);
  S.code = code; S.role = 'player'; S.pid = pid;
  B.presence('rooms/' + code + '/players/' + pid + '/online');
  history.replaceState(null, '', location.pathname + '?room=' + code);
  subscribeRoom();
  return null;
}
function playerOnState(){
  const s = S.state;
  if (s.round && s.round !== S.mineRound) {
    S.mineRound = s.round;
    S.localPx = emptyPx(s.n); S.undo = []; S.tool = 'pen'; S.submitted = false; S.locked = false; S.myResult = null;
    S.color = Number((s.colors || '1')[0]);
    if (S.resUnsub) S.resUnsub();
    S.resUnsub = B.on(roomPath('results/' + s.round + '/' + S.pid), v => { S.myResult = v; render(true); });
    if (!S.totUnsub) S.totUnsub = B.on(roomPath('totals/' + S.pid), v => { S.myTotal = v; updateDynamic(); });
    B.get(roomPath('draws/' + s.round + '/' + S.pid)).then(d => {
      if (d && d.px && d.px.length === s.n * s.n && S.mineRound === s.round && !/[1-9]/.test(S.localPx)) { S.localPx = d.px; S.submitted = !!d.done; render(true); }
    });
  }
  if (s.phase === 'lobby') { S.mineRound = null; S.history = null; S.myTotal = null; }
  if (s.phase === 'end' && !S.history) loadHistory();
}
async function loadHistory(){
  const s = S.state; S.history = [];
  const h = [];
  for (let r = 1; r <= s.total; r++) {
    const d = await B.get(roomPath('draws/' + r + '/' + S.pid));
    const res = await B.get(roomPath('results/' + r + '/' + S.pid));
    const pic = (s.pics || [])[r - 1];
    h.push({ r, px: d && d.px, s: res ? res.s : 0, pic });
  }
  S.history = h; render(true);
}
function writeDraw(force){
  if (S.practice) return;
  clearTimeout(S.writeT);
  const s = S.state;
  const go = () => { if (S.state && S.state.round === s.round) B.set(roomPath('draws/' + s.round + '/' + S.pid), { px: S.localPx, done: !!S.submitted }); };
  if (force) go(); else S.writeT = setTimeout(go, 700);
}
function canPaint(){ const s = S.state; return (S.role === 'player' || S.practice) && s && s.phase === 'draw' && !S.submitted && !S.locked; }
function paintBoard(){
  const s = S.state; if (!s) return;
  document.querySelectorAll('canvas[data-grid="edit"]').forEach(cv => drawGrid(cv, S.localPx, s.n, canPaint()));
}
function cellFromEvent(cv, e, n){
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  if (x < 0 || y < 0 || x >= 1 || y >= 1) return null;
  return { r: Math.floor(y * n), c: Math.floor(x * n) };
}
function setCell(i, ch){ S.localPx = S.localPx.slice(0, i) + ch + S.localPx.slice(i + 1); }
function paintCell(cell, n){ if (cell) setCell(cell.r * n + cell.c, S.tool === 'erase' ? '0' : String(S.color)); }
function paintLine(a, b, n){
  if (!a) { paintCell(b, n); return; }
  let x0 = a.c, y0 = a.r; const x1 = b.c, y1 = b.r;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) { paintCell({ r: y0, c: x0 }, n); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
}
function floodFill(cell, n){
  if (!cell) return;
  const from = S.localPx[cell.r * n + cell.c], to = String(S.color);
  if (from === to) return;
  const a = [...S.localPx], st = [[cell.r, cell.c]];
  while (st.length) {
    const [r, c] = st.pop();
    if (r < 0 || c < 0 || r >= n || c >= n || a[r * n + c] !== from) continue;
    a[r * n + c] = to;
    st.push([r + 1, c], [r - 1, c], [r, c + 1], [r, c - 1]);
  }
  S.localPx = a.join('');
}
function bindDrawing(cv){
  const n = S.state.n;
  cv.addEventListener('pointerdown', e => {
    if (!canPaint()) return;
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (er) {}
    S.undo.push(S.localPx); if (S.undo.length > 40) S.undo.shift();
    const cell = cellFromEvent(cv, e, n);
    if (S.tool === 'fill') { floodFill(cell, n); paintBoard(); writeDraw(); return; }
    S.drawing = true; S.lastCell = cell; paintCell(cell, n);
    paintBoard(); writeDraw();
  });
  cv.addEventListener('pointermove', e => {
    if (!S.drawing || !canPaint()) return;
    e.preventDefault();
    const cell = cellFromEvent(cv, e, n); if (!cell) return;
    if (S.lastCell && cell.r === S.lastCell.r && cell.c === S.lastCell.c) return;
    paintLine(S.lastCell, cell, n); S.lastCell = cell;
    paintBoard(); writeDraw();
  });
  const end = () => { if (!S.drawing) return; S.drawing = false; S.lastCell = null; writeDraw(true); };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('lostpointercapture', end);
}

/* 썸네일: 원본과 겹쳐 보기 — 맞은 칸은 그대로, 놓친 칸은 흐리게, 색이 다른 칸은 가운데에 원본 색 */
function paintThumb(cv, px, target, n, overlay){
  const rect = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const size = Math.max(10, Math.round(rect.width * dpr));
  if (cv.width !== size) { cv.width = size; cv.height = size; }
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#0B0F1A'; ctx.fillRect(0, 0, size, size);
  const gap = Math.max(1, Math.round(size / n * 0.05)), cell = (size - gap * (n - 1)) / n;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const i = r * n + c, v = +px[i], t = +target[i];
    const x = Math.round(c * (cell + gap)), y = Math.round(r * (cell + gap)), w = Math.ceil(cell);
    ctx.globalAlpha = 1;
    ctx.fillStyle = COLORS[v]; ctx.fillRect(x, y, w, w);
    if (!overlay) continue;
    if (!v && t) { ctx.globalAlpha = 0.38 * overlay; ctx.fillStyle = COLORS[t]; ctx.fillRect(x, y, w, w); }
    else if (v && !t) { ctx.globalAlpha = 0.72 * overlay; ctx.fillStyle = '#0B0F1A'; ctx.fillRect(x, y, w, w); }
    else if (v && t && v !== t) { ctx.globalAlpha = overlay; ctx.fillStyle = COLORS[t]; const q = Math.ceil(w * 0.5), o = Math.floor((w - q) / 2); ctx.fillRect(x + o, y + o, q, q); }
  }
  ctx.globalAlpha = 1;
}
function heatCounts(){
  const rv = S.rv; const n = rv.n; const c = new Array(n * n).fill(0); let cnt = 0;
  rv.order.forEach(id => {
    if (rv.hidden[id]) return;
    cnt++;
    const px = rv.draws[id].px;
    for (let i = 0; i < px.length; i++) if (px[i] !== '0') c[i]++;
  });
  return { c, cnt };
}
function paintHeat(cv){
  const rv = S.rv; if (!cv || !rv) return;
  const { c, cnt } = heatCounts(), n = rv.n;
  const rect = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1, size = Math.max(10, Math.round(rect.width * dpr));
  if (cv.width !== size) { cv.width = size; cv.height = size; }
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#0B0F1A'; ctx.fillRect(0, 0, size, size);
  const gap = Math.max(1, Math.round(size / n * 0.05)), cell = (size - gap * (n - 1)) / n;
  const RAMP = ['#1C2340', '#2F3F6B', '#3F6F86', '#5FA88A', '#A8D66E', '#FFE14D'];
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) {
    const v = cnt ? c[r * n + k] / cnt : 0;
    ctx.fillStyle = v ? RAMP[Math.min(5, 1 + Math.floor(v * 5))] : RAMP[0];
    ctx.fillRect(Math.round(k * (cell + gap)), Math.round(r * (cell + gap)), Math.ceil(cell), Math.ceil(cell));
  }
}
function memoryStat(){
  const rv = S.rv; const { c, cnt } = heatCounts();
  let inT = 0, got = 0;
  for (let i = 0; i < rv.target.length; i++) if (rv.target[i] !== '0') { inT++; if (cnt && c[i] / cnt >= 0.5) got++; }
  const vals = Object.values(rv.results).map(x => x.s);
  const avg = vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : 0;
  return { avg, pct: inT ? Math.round(got / inT * 100) : 0, cnt };
}

const PR_SET = 5;
const PR_LEVELS = {
  8: { name: '쉬움', sub: '8×8 · 2색', sizes: [8, 8, 8, 8, 8] },
  10: { name: '보통', sub: '10×10 · 3~4색', sizes: [10, 10, 10, 10, 10] },
  12: { name: '어려움', sub: '12×12 · 5~6색', sizes: [12, 12, 12, 12, 12] },
  mix: { name: '차례로', sub: '쉬움에서 어려움까지', sizes: [8, 8, 10, 10, 12] }
};
function prBest(level){ const v = parseInt(lsGet('pm-best-' + level), 10); return isNaN(v) ? null : v; }
function showPracticeMenu(){
  clearSubs();
  S.practice = null; S.code = null; S.role = null; S.state = null; S.viewKey = '';
  history.replaceState(null, '', location.pathname);
  const btn = (lv, cls) => { const L = PR_LEVELS[lv], b = prBest(lv); return `<button class="btn ${cls}" data-practice="${lv}"><span>${L.name} <small style="font-size:15px">${L.sub}</small></span><span class="pix" style="font-size:10px">${b == null ? '' : 'BEST ' + b}</span></button>`; };
  app.innerHTML = `<div class="center"><div class="card">
    <div style="display:flex;justify-content:center">${logoHTML()}</div>
    <div class="pix" style="text-align:center;font-size:12px;color:var(--yellow)">PRACTICE MODE</div>
    <div class="home-btns">${btn(8, '')}${btn(10, 'blue')}${btn(12, 'pink')}${btn('mix', 'yellow')}</div>
    <div class="note">그림을 잠깐 보고 기억나는 대로 칠해요. 한 번에 ${PR_SET}판을 하고, 기록은 이 기기에만 남아요.</div>
    <button class="btn ghost small" data-home="back">처음으로</button>
  </div></div>`;
}
function startPractice(level){
  clearSubs();
  const L = PR_LEVELS[level], used = {};
  const plan = L.sizes.map((n, idx) => {
    const seen = used[n] = used[n] || [];
    const pool = PICS[n].map((_, i) => i).filter(i => !seen.includes(i));
    const i = pool[Math.floor(Math.random() * pool.length)];
    seen.push(i);
    const before = L.sizes.slice(0, idx).filter(x => x === n).length;
    return { n, i, view: n === 12 ? 10 : (before ? 8 : 10) };
  });
  S.code = 'practice'; S.role = 'practice'; S.viewKey = ''; S.history = null;
  S.practice = { level, plan, results: [], newBest: false, avg: 0 };
  S.tick = setInterval(onTick, 250);
  practiceRound(1);
}
function practiceRound(r){
  const pr = S.practice, p = pr.plan[r - 1], now = B.now();
  S.mineRound = r; S.localPx = emptyPx(p.n); S.undo = []; S.tool = 'pen'; S.submitted = false; S.locked = false; S.drawing = false;
  const colors = picColors(picPx(p.n, p.i));
  S.color = Number(colors[0]);
  S.state = { phase: 'view', round: r, total: pr.plan.length, n: p.n, colors, viewSec: p.view, viewAt: now + READY_MS, viewEndsAt: now + READY_MS + p.view * 1000 };
  render(true);
}
function practiceTick(){
  const s = S.state; if (!s) return;
  const now = B.now();
  if (s.phase === 'view' && now >= s.viewEndsAt) {
    S.state = { ...s, phase: 'draw', drawEndsAt: now + DRAW_SEC * 1000 };
    render(true);
  } else if (s.phase === 'draw' && now >= s.drawEndsAt) practiceFinish();
}
function practiceFinish(){
  const s = S.state, pr = S.practice; if (!s || s.phase !== 'draw') return;
  S.drawing = false;
  const p = pr.plan[s.round - 1], score = scoreDrawing(picPx(p.n, p.i), S.localPx, p.n);
  pr.results[s.round - 1] = { r: s.round, px: S.localPx, s: score, pic: { n: p.n, i: p.i } };
  S.state = { ...s, phase: 'result' };
  sfx([67, 71, 74], 0.08, 1);
  render(true);
}
function practiceNext(){
  const s = S.state, pr = S.practice; if (!s || s.phase !== 'result') return;
  if (s.round < s.total) { practiceRound(s.round + 1); return; }
  pr.avg = Math.round(pr.results.reduce((x, y) => x + y.s, 0) / pr.results.length);
  const best = prBest(pr.level);
  pr.newBest = best == null || pr.avg > best;
  if (pr.newBest) lsSet('pm-best-' + pr.level, String(pr.avg));
  S.history = pr.results;
  S.state = { ...s, phase: 'end' };
  if (pr.newBest) setTimeout(confetti, 200);
  render(true);
}
function prComment(v){ return v === 100 ? '완벽해요!' : v >= 90 ? '거의 완벽해요!' : v >= 70 ? '잘 기억했어요' : v >= 40 ? '모양이 보여요' : v > 0 ? '다음엔 전체 모양부터 잡아 봐요' : '아직 칠한 칸이 없어요'; }
function renderPractice(force){
  const s = S.state; if (!s) return;
  let k = 'x:' + s.phase + ':' + s.round;
  if (s.phase === 'view') k += ':' + (B.now() >= s.viewAt);
  if (s.phase === 'draw') k += ':' + S.color + ':' + S.tool;
  if (!force && k === S.viewKey) return;
  const screenChanged = k.split(':').slice(0, 3).join(':') !== S.viewKey.split(':').slice(0, 3).join(':');
  S.viewKey = k;
  if (s.phase === 'view') {
    app.innerHTML = practiceViewHTML();
    if ($('#prSrc')) { const p = S.practice.plan[s.round - 1]; requestAnimationFrame(() => plainGrid($('#prSrc'), picPx(p.n, p.i), p.n)); }
  } else if (s.phase === 'draw') {
    app.innerHTML = playerDrawHTML();
    const cv = document.querySelector('canvas[data-grid="edit"]');
    if (cv) { cv._prev = null; bindDrawing(cv); paintBoard(); }
  } else if (s.phase === 'result') {
    app.innerHTML = practiceResultHTML();
    const R = S.practice.results[s.round - 1];
    requestAnimationFrame(() => { const t = picPx(R.pic.n, R.pic.i); paintThumb($('#pMine'), R.px, t, R.pic.n, 1); plainGrid($('#pSrc'), t, R.pic.n); });
  } else if (s.phase === 'end') {
    app.innerHTML = practiceEndHTML();
    afterPlayerEnd();
  }
  if (screenChanged) animateEnter();
}

function setText(id, t){ const el = document.getElementById(id); if (el && el.textContent !== t) el.textContent = t; }
function setSeg(id, ratio){ const el = document.getElementById(id); if (el) { const on = Math.ceil(Math.max(0, Math.min(1, ratio)) * 10); [...el.querySelectorAll('i')].forEach((x, i) => x.classList.toggle('on', i < on)); } }
function updateDynamic(){
  const s = S.state; if (!s || !B) return;
  const now = B.now();
  if (s.phase === 'view') {
    setText('readyNum', String(Math.max(1, Math.ceil((s.viewAt - now) / 1000))));
    const left = Math.max(0, s.viewEndsAt - now);
    setText('viewTime', String(Math.ceil(left / 1000)));
    setSeg('viewSeg', left / (s.viewSec * 1000));
    setText('pViewTime', now < s.viewAt ? '곧 나와요' : Math.ceil(left / 1000) + '초');
  }
  if (s.phase === 'draw') {
    const left = Math.max(0, s.drawEndsAt - now);
    const t = mmss(left), ratio = left / ((s.drawSec || DRAW_SEC) * 1000);
    setText('drawTime', t); setText('drawTimeP', t);
    setSeg('drawSeg', ratio); setSeg('drawSegP', ratio);
    if (S.role === 'host') {
      const on = onlinePlayers();
      const done = on.filter(p => S.liveDraws[p.id] && S.liveDraws[p.id].done).length;
      setText('cntDone', done + '');
      setText('cntPaint', Math.max(0, on.length - done) + '');

async function goHome(){
  clearSubs();
  try { if (B.unpresence) await B.unpresence(); } catch (e) {}
  if (S.role === 'player' && S.code && S.pid) { try { await B.set(roomPath('players/' + S.pid + '/online'), false); } catch (e) {} }
  S.code = null; S.role = null; S.pid = null; S.state = null; S.meta = null; S.players = {}; S.viewKey = ''; S.rv = null; S.mineRound = null; S.history = null; S.seenSelf = false; S.practice = null;
  Music.stop(); showHome();
}
document.addEventListener('click', async e => {
  const col = e.target.closest('[data-color]');
  if (col) { S.color = +col.dataset.color; if (S.tool === 'erase') S.tool = 'pen'; render(true); return; }
  const set = e.target.closest('[data-set]');
  if (set && S.role === 'host') { const raw = set.dataset.val; B.update(roomPath('meta/settings'), { [set.dataset.set]: isNaN(+raw) ? raw : +raw }); return; }
  const kick = e.target.closest('[data-kick]');
  if (kick && S.role === 'host') {
    B.remove(roomPath('players/' + kick.dataset.kick));
    return;
  }
  const th = e.target.closest('[data-thumb]');
  if (th && S.rv) { const id = th.dataset.thumb; S.rv.hidden[id] = !S.rv.hidden[id]; render(true); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'bgm') { Music.toggle(); updateBgmButtons(); }
  else if (act === 'start') { Music.init(); await startGame(); }
  else if (act === 'next') hostNext();
  else if (act === 'forcefinish') { const s = S.state; if (s && s.phase === 'draw' && onceFor('finish:' + s.round)) finishRound(s.round); }
  else if (act === 'newgame') hostNewGame();
  else if (act === 'gohome') goHome();
  else if (act === 'undo') { if (canPaint() && S.undo.length) { S.localPx = S.undo.pop(); paintBoard(); writeDraw(); } }
  else if (act === 'erase') { S.tool = S.tool === 'erase' ? 'pen' : 'erase'; render(true); }
  else if (act === 'fill') { S.tool = S.tool === 'fill' ? 'pen' : 'fill'; render(true); }
  else if (act === 'clearall') { if (canPaint()) { S.undo.push(S.localPx); S.localPx = emptyPx(S.state.n); paintBoard(); writeDraw(); } }
  else if (act === 'done') { if (S.practice) { practiceFinish(); return; } S.submitted = true; writeDraw(true); render(true); }
  else if (act === 'pnext') practiceNext();
  else if (act === 'pagain') startPractice(S.practice.level);
  else if (act === 'pquit') showPracticeMenu();
  else if (act === 'undone') { S.submitted = false; writeDraw(true); render(true); }
});

    if (q.get('room')) { showJoin(q.get('room')); const er = $('#jErr'); if (er) er.textContent = NOCONN_MSG; }
    else { S.noConn = true; showHome(); }
    return;
  }
  if (q.get('host')) { if (await resumeHost(q.get('host'))) return; showHome(); return; }
  if (q.get('room')) {
    const code = q.get('room'), pid = pidGet(code);
    if (pid) { const pl = await B.get('rooms/' + code + '/players/' + pid); if (pl && pl.name) { const m = await joinRoom(code, pl.name); if (!m) return; } }
    showJoin(code); return;
  }
  showHome();
})();

</script>
</body>
</html>
